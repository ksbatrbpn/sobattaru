name: Sinkronkan SIGAP

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-sigap
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil proyek
        uses: actions/checkout@v4

      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pasang pengolah citra
        run: python -m pip install --disable-pip-version-check pillow

      - name: Ambil peta terbaru dari SIGAP
        run: python scripts/sync_sigap.py

      - name: Simpan hasil sinkronisasi
        run: |
          git config user.name "sobat-taru-sync"
          git config user.email "sobat-taru-sync@users.noreply.github.com"
          git add data/kawasan_hutan_sigap_ksb.png \
                  data/kawasan_hutan_sigap_ksb_raw.png \
                  data/sigap_status.json
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan data."
          else
            git commit -m "chore: sinkronkan data SIGAP"
            git push
          fi
